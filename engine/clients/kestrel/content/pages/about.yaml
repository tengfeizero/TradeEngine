slug: about
status: published
title:
  en: Fifteen years of building the thing that breaks
  zh: 十五年，一直在造那个会坏的东西
summary:
  en: Started in 2011 rebuilding gimbals for a Shenzhen camera shop. Still run by the same two people, still shipping from Bao'an.
  zh: 2011 年从给深圳一家相机店修云台开始。至今还是那两个人管，还是从宝安出货。
updated_at: 2026-10-22
blocks:
  - type: richtext
    title:
      en: We started on the repair side
      zh: 我们是从维修那一头开始的
    lead:
      en: The company began as a repair bench, not a factory. That is still how we decide what to build.
      zh: 这家公司是从一张维修台开始的，不是从工厂开始的。我们决定造什么，用的还是那套判断。
    body:
      en: |
        In 2011 two of us repaired camera gimbals for a shop in Huaqiangbei. The work was mostly the same three failures, and after two years we had a clear opinion about which parts were designed badly. The first product was a replacement gimbal ribbon that did not fatigue at 3,000 cycles.

        The habit stuck. We still keep a return bench in the plant, and the people who work there report directly to engineering rather than to after-sales. When a return rate moves, the conversation is about the design, not about the customer's usage.

        We are 148 people now, 62 of them in engineering. We export to 48 countries and we have never had a year where the largest single customer was more than 18 percent of revenue, which is deliberate — an OEM business that depends on one buyer is a job, not a company.
      zh: |
        2011 年，我们两个人在华强北给一家店修相机云台。修来修去就是那三种故障，两年后我们对哪些件设计得糟糕有了很明确的看法。第一件产品是一根不会在 3,000 次循环时疲劳的云台排线。

        这个习惯留下来了。厂里至今有一张返修台，坐在那里的人直接向工程汇报，而不是向售后汇报。返修率一动，讨论的是设计，不是客户用法。

        现在是 148 人，其中 62 人在研发。出口 48 个国家，从没有哪一年最大单一客户超过营收的 18%——这是刻意控制的：一个靠一个买家的 OEM 生意是一份工作，不是一家公司。
