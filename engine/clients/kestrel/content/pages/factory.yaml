    retention:
      en: Every lot keeps one complete unit and 20 cells from the same battery lot, sealed, for 18 months — cells age faster than airframes, and 18 months is the window where a field failure still tells us something about the build.
      zh: 每批留一台整机与同批电芯 20 只，封存 18 个月——电芯比机体老得快，而 18 个月是现场失效还能说明装配问题的窗口期。
