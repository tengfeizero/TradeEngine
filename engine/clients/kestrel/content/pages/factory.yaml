slug: factory
status: published
title:
  en: A 12,000 m² plant in Bao'an, and what happens inside it
  zh: 宝安 12,000 平方米厂区，以及里面发生的事
summary:
  en: Two SMT lines, four assembly cells, an anechoic chamber and a flight test cage. Every unit flies before it is packed.
  zh: 两条 SMT 线、四个装配单元、一间电波暗室与一个飞行测试笼。每台出厂前都要飞。
updated_at: 2026-10-22
blocks:
  - type: richtext
    title:
      en: What we keep in-house, and what we do not
      zh: 哪些留在厂里，哪些不放
    lead:
      en: The plant exists to control three things — flight controller assembly, gimbal calibration, and the final flight test.
      zh: 这个厂存在的目的，是控制三件事——飞控板组装、云台标定、出厂实飞。
    body:
      en: |
        The SMT lines build the flight controller and the BMS boards. Those two boards carry our firmware and our failure modes, and a contract manufacturer changing a component supplier without telling us is the kind of surprise that ends with a recall. Everything on those boards is traceable to a lot number.

        The assembly cells are semi-manual on purpose. A fully automated line at 2,400 units a month would spend more time changing over between the six platforms than building. The cells are set up per platform and change over in 40 minutes.

        What we do not make is the airframe carbon. It is laid up by a specialist 90 minutes away, to our ply schedule, and we inspect every frame for delamination on receipt. Making carbon ourselves would add 2,000 m² and one more process we would be mediocre at.
      zh: |
        SMT 线生产飞控板与 BMS 板。这两块板承载我们的固件与失效模式，而代工厂在我们不知情的情况下换掉一个元件供应商，这种"惊喜"最后会以召回收场。板上每一个元件都能追到批次。

        装配单元是刻意做成半手工的。月产 2,400 台的自动化线，在六条平台之间换型的时间会比生产时间还长。现在的单元按平台布置，换型 40 分钟。

        我们不做的是机身碳纤维。它由 90 分钟车程外的一家专业厂按我们的铺层表成型，到货后逐台敲击检查分层。自己做碳纤维要多 2,000 平方米车间，还多一道我们只会做得平庸的工序。
