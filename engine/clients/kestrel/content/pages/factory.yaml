  - type: process
    title:
      en: How a unit moves through the plant
      zh: 一台机器在厂里的路线
    intro:
      en: Nine working days from kit issue to packed carton on a standard order, twelve with a custom label or firmware key.
    steps:
      - title:
          en: Kit issue and traceability
          zh: 备料与追溯
        body:
          en: Every frame, motor and board is scanned into the unit record. The record follows the aircraft through test and is what we query when a field failure comes back.
          zh: 每个机架、电机、板卡都扫进整机档案。这份档案跟着飞机走完测试，现场失效返回时我们查的就是它。
      - title:
          en: Sub-assembly and calibration
          zh: 部件装配与标定
        body:
          en: Gimbal is calibrated on a three-axis rate table, not by hand. The calibration file is stored per serial number, so a replacement gimbal is calibrated before it ships.
          zh: 云台在三轴速率台上标定，不靠手工。标定文件按序列号存档，替换云台在出厂前就已完成标定。
      - title:
          en: Firmware and keys
          zh: 固件与密钥
        body:
          en: The firmware hash is written into the unit record and matched against the certification revision. Customer keys are loaded here and never leave the plant in plaintext.
          zh: 固件哈希写进整机档案，并与认证版本比对。客户密钥在这一步写入，明文不出厂。
      - title:
          en: Environmental screening
          zh: 环境筛选
        body:
          en: 30 minutes of thermal cycling from -10 to 45 °C with the unit powered and logging. Units that log a sensor fault here do not go to flight test.
          zh: 通电记录状态下做 30 分钟 -10 至 45 ℃ 温度循环。在这一步记录到传感器故障的机器，不进入飞行测试。
      - title:
          en: Flight test
          zh: 实飞测试
        body:
          en: Every unit flies a six-minute automated profile inside the cage — hover stability, gimbal sweep, link margin at low power, and a deliberate compass disturbance to confirm the redundancy switch. The log ships with the aircraft.
          zh: 每台在笼内飞六分钟自动科目——悬停稳定性、云台扫掠、低功率下的链路余量，以及一次人为罗盘干扰以确认冗余切换。日志随飞机交付。
      - title:
          en: Pack and document
          zh: 包装与文件
        body:
          en: The carton gets the flight log card, the compliance sheet, and the UN38.3 lot number for the batteries in that specific box. Battery serials are matched to the carton, not to the order.
          zh: 箱内放飞行日志卡、合规说明，以及这一箱电池对应的 UN38.3 批次号。电池序列号对应到箱，而不是对应到订单。
