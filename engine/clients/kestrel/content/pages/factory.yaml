  - type: factory
    kicker:
      en: Audit trail
      zh: 审核与记录
    title:
      en: What you can verify without flying to Shenzhen
      zh: 不来深圳也能核的部分
    intro:
      en: A plant photo proves there is a plant. A report number proves somebody outside the company looked at it — so the numbers below are the ones you can look up.
      zh: 厂房照片只能证明有厂房。报告编号才能证明公司以外的人查过——所以下面这些编号都是你能查的。
    equipment:
      - name:
          en: SMT lines for flight controller and BMS
          zh: 飞控与 BMS 板 SMT 线
        qty: "2"
        note:
          en: Yamaha mounters, ten-zone reflow, AOI after each pass
          zh: Yamaha 贴片机、十温区回流焊、每道后 AOI
      - name:
          en: Flight test cage
          zh: 飞行测试笼
        qty: "1"
        note:
          en: 12 × 8 × 5 m, netted, six-minute automated profile
          zh: 12 × 8 × 5 米，带防护网，六分钟自动科目
      - name:
          en: Three-axis rate tables
          zh: 三轴速率台
        qty: "2"
        note:
          en: gimbal calibration, file stored per serial number
          zh: 云台标定，按序列号存档
      - name:
          en: Thermal cycling chambers
          zh: 温度循环箱
        qty: "4"
        note:
          en: −20 to 60 °C, unit powered and logging
          zh: −20 至 60 ℃，通电记录状态
      - name:
          en: Battery test cabinets
          zh: 电池测试柜
        qty: "2"
        note:
          en: charge/discharge cycling and internal resistance
          zh: 充放电循环与内阻
      - name:
          en: EMC pre-compliance chamber
          zh: 电磁兼容预测试暗室
        qty: "1"
        note:
          en: pre-test only — formal reports come from the third party below
          zh: 只做预测试，正式报告由下面的第三方出
