  - type: faq
    title:
      en: Visiting without visiting
      zh: 不到厂，也能看到厂
    items:
      - q:
          en: Can we do a video factory audit instead of flying in?
          zh: 能安排视频验厂吗？不飞过来。
        a:
          en: Yes. A live video walk of the SMT line, the calibration bench and the flight test cage takes about an hour, on the same terms as a plant visit — arranged for buyers evaluating a first order. We do not send a produced promo reel instead; you direct the camera, and any unit can be opened on camera.
          zh: 可以。对 SMT 线、标定工位与飞行测试笼做一次实时视频走厂，约一小时，条件与到厂相同——面向评估首单的买家安排。我们不拿制作好的宣传片代替；镜头由你指挥，任何一台整机都可以当镜头拆开。
      - q:
          en: Do you have reference customers in our region we can talk to?
          zh: 我们所在区域有可以询访的参考客户吗？
        a:
          en: Yes, by region. Several distributors and operators — including the ones behind the testimonials on this site and the Dubai perimeter deployment — have agreed to take a reference call. Ask the export desk and we will make the introduction, with the contact closest to your use case first.
          zh: 有，按区域。包括本站证言的几位经销商与运营方、迪拜周界项目的客户在内，多家客户同意接受参考询访。向出口部提出即可，我们会做引荐，并优先安排与你的使用场景最接近的一位。
  - type: cta
    title:
      en: Come and watch the flight test
      zh: 来看一次实飞测试
    body:
      en: If you are evaluating a first order above 50 units, we will arrange a plant visit with two weeks notice. You can pick any unit off the line and watch it fly, then take the log home.
      zh: 如果你在评估 50 台以上的首单，提前两周我们可以安排到厂。你可以从线上随机挑一台看它飞，然后把日志带走。
    cta_text:
      en: Arrange a visit
      zh: 安排到厂
    cta_href: "/contact/"
