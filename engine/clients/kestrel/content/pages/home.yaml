      zh: 先说{任务}，再定机身。
    sub:
      en: Six platforms, each specified against the failure its operators actually complain about — spray drift, gimbal water ingress, a rebuild that takes a week. Certification reports are tied to the hardware revision printed on the label.
      zh: 六条平台线，每一款都是对着操作员真正会抱怨的失败点定的规格——飘移、云台进水、重装要一周。认证报告与机身标签上的硬件版本严格对应。
