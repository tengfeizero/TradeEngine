title:
  en: Task-specific UAV platforms, exported with the paperwork done
  zh: 为具体任务造的无人机平台，出口文件随货备齐
summary:
  en: Six UAV platforms for film, agriculture, inspection, security, logistics and FPV — shipped from Shenzhen with certification and customs paperwork done.
  zh: 影视、农业、巡检、安防、物流与 FPV 六条无人机平台线，自深圳出货，认证与清关文件随货备齐。
updated_at: 2026-10-22
