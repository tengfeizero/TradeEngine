summary:
  en: Built for terraces, greenhouses and plots under three hectares, where a 40 L machine cannot turn around. Folds to 780 mm and weighs 24 kg dry, so one operator loads it into a kei truck without a ramp.
  zh: 为梯田、大棚与三公顷以下地块设计，40 升机型在这些地方转不开身。折叠后 780 毫米、空机 24 公斤，一人可装进轻型卡车，不需要坡道。

description:
  en: |
    Half the world's farmland is in plots too small for a 40 L machine to be efficient. Japan, Korea, southern China, the Mediterranean hills — the fields are 0.2 to 1 hectare, the access roads are narrow, and the refill point is often a hose at the edge of a terrace.

    The AG-16 carries 16 L, sprays a 6.5 m swath and folds to 780 mm. Two people can move it between terraces by hand, and one person can load it alone. It uses the same nozzle family and the same RTK base station as the AG-40, so a dealer stocking both carries one set of wear parts.

    The control software has a terrace mode that records the polygon once and reuses it, because re-teaching a 0.4-hectare plot before every flight is how small-plot operators give up on drones.
  zh: |
    世界上有一半农田的地块小到 40 升机型无法高效作业。日本、韩国、中国南方、地中海丘陵——地块 0.2 到 1 公顷，机耕道很窄，加药点常常只是梯田边的一根水管。

    AG-16 载药 16 升，喷幅 6.5 米，折叠后 780 毫米。两人可手抬在梯田之间转移，一人可独自装车。喷头系列与 RTK 基站与 AG-40 通用，同时备这两款的经销商只需一套易损件。

    控制软件有梯田模式：地块多边形录一次，之后复用。因为每次起飞前重教一块 0.4 公顷的地，正是小地块用户放弃无人机的真实原因。

