title:
  en: AG-40 Hexa
  zh: AG-40 六旋翼植保机
subtitle:
  en: 40 L tank, 21 hectares per hour, per-nozzle flow control
  zh: 40 升药箱、每小时 21 公顷、逐喷头流量控制
summary:
  en: The workhorse for orchards and row crops where a full tank has to cover 22 hectares before the refill truck catches up. Eight nozzles with individual flow control, so a blocked nozzle shows up as a pressure fault instead of a stripe in the field.
  zh: 果园与大田的主力机型：一箱药要覆盖 22 公顷，等加药车追上来。八个喷头各自控制流量，堵一个喷头会在屏幕上显示压力故障，而不是田里一条没喷到的空带。

description:
  en: |
    Spraying economics are decided by two numbers: hectares per tank and minutes per refill. A 40 L tank at 22 L/ha gives you 1.8 hectares per fill on paper. In an orchard with 25 percent overlap on the headlands you actually get 1.4, and that is the number your customer will quote back at you when the machine underperforms.

    We publish the overlap-adjusted figure, not the brochure figure. The AG-40 holds 40 L usable, sprays 22 L/ha at 4 m/s with an 11 m swath, and the mission planner subtracts headland overlap before it estimates coverage, so the operator sees the honest number on the tablet.

    Per-nozzle flow control is the other half. Each of the eight nozzles has its own solenoid and pressure sensor, so a partial blockage drops that nozzle's flow and raises a fault instead of quietly leaving an unsprayed stripe. On a 200-hectare contract that stripe is the difference between a repeat order and a dispute.
  zh: |
    植保的经济性由两个数字决定：一箱能打多少公顷，加一次药要几分钟。40 升药箱按 22 升/公顷，纸面上是 1.8 公顷一箱。果园地头有 25% 重叠，实际只有 1.4 公顷——机器不达预期时，客户拿回来质问你的正是这个数。

    我们给的是扣除重叠后的数字，不是画册上的数字。AG-40 可用药量 40 升，4 米/秒、11 米喷幅下 22 升/公顷，航线规划会在估算覆盖面积前先扣掉地头重叠，操作员在平板上看到的是诚实值。

    另一半是逐喷头控制。八个喷头各有电磁阀与压力传感器，半堵塞会让该喷头流量下降并报故障，而不是安静地留下一条未喷带。在 200 公顷的合同里，这条空带就是返单和纠纷的区别。

