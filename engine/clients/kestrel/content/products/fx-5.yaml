summary:
  en: A race frame built to survive the first crash, not to win a spec sheet. 5 mm arms, a stack bay that takes standard 30.5 mm boards, and every part available as a single spare so a team can rebuild between heats.
  zh: 为「第一次炸机后还能飞」而造的竞速机架，不是为了赢参数表。5 毫米机臂、兼容标准 30.5 毫米孔位的飞控仓、所有零件可单件供应，车队能在两轮预赛之间完成重装。

description:
  en: |
    Race teams do not buy aircraft, they buy rebuild speed. A frame that needs a full teardown after a gate strike costs a heat. A frame with a bolt-on arm costs four minutes.

    The FX-5 uses 5 mm carbon arms on a single-screw clamp, so an arm swap is four screws and no desoldering. The stack bay takes standard 30.5 × 30.5 mm flight controllers and 20 × 20 mm ESCs, which means a team can run the electronics they already know instead of our board. The camera cage is a separate printed part, so a lens strike does not write off the frame.

    We supply the race kit as individual SKUs — arms, cages, top plates, motor mounts — with a two-week restock on any single part. For a league buying 60 airframes, that restock promise matters more than the 180 km/h number.
  zh: |
    竞速队买的不是飞机，是重装速度。撞门之后要整机拆解的机架，代价是一轮比赛。机臂螺栓连接的机架，代价是四分钟。

    FX-5 用 5 毫米碳纤维机臂配单螺钉夹紧，换一根机臂是四颗螺丝，不用重新焊接。飞控仓兼容标准 30.5 × 30.5 毫米飞控与 20 × 20 毫米电调，车队可以继续用自己熟悉的电子件，而不是我们的板子。摄像头护笼是独立打印件，镜头撞了不会整车报废。

    竞速套件按单件 SKU 供应——机臂、护笼、顶板、电机座——任何单件的补货周期是两周。对一个采购 60 台机身的联赛来说，这个补货承诺比 180 公里/小时更值钱。

