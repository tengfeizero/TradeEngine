  en: One aircraft for the two inspections a utility actually runs — thermal on the conductor clamps, optical zoom on the insulator strings. Both cameras point the same direction, so the thermal and visible frames of the same tower line up without a second flight.
  zh: 一台机器覆盖电力公司真正会做的两种巡检——导线线夹测温、绝缘子串变焦拍照。两个相机同轴，同一基塔的热成像与可见光画面无需二次飞行即可对齐。

description:
  en: |
    Inspection buyers care about one thing after the first month: how many towers a crew can do in a day, and whether the images are usable in the asset management system afterwards without a human sorting them.

    The IN-25 puts a 640×512 radiometric sensor and a 48 MP 10× optical zoom on the same stabilized axis. A single pass gives you the hot spot and the close-up of the same fitting, already aligned. The on-board processor tags each image with GPS, gimbal attitude, tower ID from the flight plan and the measured temperature, and writes a CSV index alongside the images.

    The CSV index is the part customers underestimate. Without it, a 400-image flight is a folder someone has to rename by hand. With it, the images drop into most asset management systems as records rather than files.
  zh: |
    巡检客户在第一个月之后只关心两件事：一天能飞多少基塔，以及拍回来的图能不能直接进资产管理系统，而不是让人先手工分拣一遍。

    IN-25 把 640×512 测温热成像与 4800 万像素 10 倍光学变焦装在同一根增稳轴上。一次通场就能拿到同一个金具的热点与特写，且已经对齐。机载处理器给每张图打上 GPS、云台姿态、航线里的塔号与实测温度，并在图片旁边写一份 CSV 索引。

    CSV 索引是客户最容易低估的部分。没有它，一次 400 张的飞行就是一个需要有人手工改名的文件夹；有了它，图片在多数资产管理系统里是记录，而不是文件。

