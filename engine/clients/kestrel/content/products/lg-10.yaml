summary:
  en: A cargo platform specified for the route that has to work in the rain, not the demo that works on a sunny Tuesday. 10 kg over 18 km round trip, dual redundant flight control, and a parachute that deploys on power loss.
  zh: 为「雨天也得飞」的航线定的规格，而不是「周二晴天演示」的那种。10 公斤、18 公里往返，双冗余飞控，失电自动开伞。

description:
  en: |
    Medical drone programmes die at the regulator, not at the airframe. The authority asks for the failure modes, the parachute deployment test, the battery thermal data and the geofence behaviour, and the project stalls for a year waiting for documents.

    We build the LG-10 with the document pack as a deliverable, not an afterthought. Every unit ships with the failure mode and effects analysis, parachute deployment test video and data, battery UN38.3 plus thermal runaway test, and the geofence and lost-link behaviour log from the factory acceptance flight.

    On the aircraft side the numbers are deliberately conservative. 10 kg payload for 18 km round trip in still air, 7 kg for 18 km with a 6 m/s headwind, and the cold-chain box holds 8 L at 2–8 °C for 90 minutes on its own battery. The winch lowers the load from 30 m so the aircraft never has to land at the clinic.
  zh: |
    医疗无人机项目死在监管环节，不是死在机身上。当局会要失效模式分析、开伞试验、电池热失控数据与地理围栏行为，然后项目为等文件停一年。

    LG-10 把文件包当成交付物的一部分，而不是补做的事后工作。每台随机交付失效模式与影响分析、开伞试验视频与数据、电池 UN38.3 与热失控试验、以及工厂验收飞行时的地理围栏与失联行为日志。

    飞机侧的数字刻意保守。静风 10 公斤飞 18 公里往返，6 米/秒顶风时 7 公斤飞 18 公里；冷链箱用自带电池把 8 升维持在 2–8 ℃ 达 90 分钟。绞车从 30 米放下货物，飞机不必在诊所落地。

