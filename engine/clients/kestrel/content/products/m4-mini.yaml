  en: The sub-250 g model that lets your retail customers fly in the EU C0 category and skip registration in Japan and the US. Same 1/1.3-inch sensor platform across three SKUs, so parts stock stays small.
  zh: 249 克机型，让你的零售客户在欧盟按 C0 类别飞行，在日本与美国免登记。三个 SKU 共用同一套 1/1.3 英寸传感器平台，备件库存压力小。

description:
  en: |
    The 249 g limit is a legal cliff, not a marketing number. Cross it by one gram and the buyer needs an operator registration, a remote ID broadcast module and, in the EU, a C1 labelled aircraft.

    We build the M4 Mini to 242 g with the battery installed and the prop guards off, so a dealer can sell it with a one-page compliance sheet instead of a training course. The 48 MP 1/1.3-inch sensor and the 4K/60 pipeline are shared with the M4 Pro body we build on the same line, which means one sensor stock, one calibration jig and one set of spare parts for two SKUs.

    For private label we print the compliance sheet with your entity as the importer, which is what customs and market surveillance actually check.
  zh: |
    249 克是法律红线，不是营销数字。超一克，买家就需要操作员登记、远程识别广播模块，在欧盟还得是 C1 标识机型。

    M4 Mini 装电池、去护桨后是 242 克，经销商可以随货附一页合规说明，而不是卖一门培训课。4800 万像素 1/1.3 英寸传感器与 4K/60 处理链路，与我们同线的 M4 Pro 机身共用，结果是一份传感器库存、一台标定夹具、一套备件覆盖两个 SKU。

    做自有品牌时，合规说明上的进口商写成你的主体——海关与市场监管查的正是这一栏。

