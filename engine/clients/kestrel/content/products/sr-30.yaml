summary:
  en: The difference between a patrol drone and a useful one is whether it is still overhead when the incident happens. Battery gives 55 minutes, the optional tether station gives 4 hours at 120 m, and the autopilot hands over to the ground station without a landing cycle.
  zh: 巡逻无人机有没有用，取决于事发时它还在不在空中。电池 55 分钟，可选系留站在 120 米高度提供 4 小时，飞控与地面站交接不需要落地。

description:
  en: |
    Security buyers write tenders that say 24/7 coverage. No multirotor does 24/7 on batteries. What they mean is that the aircraft must be overhead within 90 seconds of an alarm, and stay there long enough for a response team to arrive.

    The SR-30 answers with two configurations. On battery it sits on a dock, wakes on an alarm input and is at 100 m in 55 seconds, with 50 minutes of station keeping. With the tether station it flies to 120 m and stays for 4 hours on ground power, so a single operator can cover an evening shift instead of swapping packs every hour.

    The payload is a 48 MP EO sensor paired with a 640×512 IR core, plus a 12,000 lumen spotlight and a 128 dB speaker. We ship the alarm and ONVIF integration notes with the unit, because a drone that cannot take a trigger from the existing VMS is a demo, not equipment.
  zh: |
    安防客户的标书里会写 7×24 覆盖。没有哪台多旋翼能靠电池做到 7×24。他们真正要的是：报警后 90 秒内机器到空中，并且在处置人员到场前一直待在那里。

    SR-30 用两种配置回答。电池模式下它停在机库，收到报警输入后 55 秒到达 100 米，定点驻留 50 分钟。配系留站时升到 120 米，用地面供电驻留 4 小时，一名操作员可以覆盖整个夜班，而不用每小时换一次电池。

    载荷是 4800 万像素可见光加 640×512 红外，另有 12,000 流明探照灯与 128 分贝喊话器。报警与 ONVIF 对接说明随货交付——接不了现有视频管理平台触发信号的无人机，只是演示品，不是装备。

