title:
  en: X9 Cine
  zh: X9 Cine 影视航拍机
subtitle:
  en: Four-thirds sensor, interchangeable lens mounts, 46-minute endurance
  zh: 4/3 传感器、可换镜头卡口、46 分钟续航
summary:
  en: The platform production companies buy when the gimbal operator and the pilot are two different people. Two gimbal bays, 10-bit 4:2:2 internal recording, and a lens mount you can change between shots.
  zh: 摄影与飞行由两人分工的剧组会选的平台。双云台位、10-bit 4:2:2 机内录制，镜头卡口可在两个镜头间更换。

description:
  en: |
    Cinema drones fail on set for boring reasons. The gimbal needs a lens change and the whole aircraft has to come down. The recording is 8-bit and the grade falls apart in the shadows. The battery swap takes four minutes and the light is gone.

    The X9 Cine is specified around those three failures. The lens mount is a locking bayonet, so a 24 mm to 50 mm swap is a 40-second ground operation. Recording is 10-bit 4:2:2 in-camera to a 1 TB removable SSD, so nothing depends on a downlink. And the battery is a rear-loading sled that a trained operator changes in under 20 seconds without powering down the gimbal.

    We ship it with the flight log export tool your insurer will ask for, and we keep the CE and FCC test reports tied to the exact hardware revision on the label, so a customs hold in Frankfurt is a document lookup rather than a phone call.
  zh: |
    影视无人机在片场翻车的原因通常很无聊。要换镜头，整机就得落地。录制是 8-bit，暗部一调就崩。换电池四分钟，光已经没了。

    X9 Cine 就是围绕这三个失败点定的规格。镜头卡口是锁紧式卡口，24 mm 换 50 mm 是 40 秒的地面操作。机内 10-bit 4:2:2 直接录进 1 TB 可拆 SSD，不依赖图传。电池是后装滑轨，受过训练的操作员 20 秒内换完，云台不用断电重启。

    随机交付飞行日志导出工具——你的保险方一定会要。CE 与 FCC 测试报告与机身标签上的硬件版本严格对应，所以在法兰克福被扣货是查一份文件，不是一个电话。

