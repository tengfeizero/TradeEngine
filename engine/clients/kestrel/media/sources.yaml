# 槽位 → 原图映射（kestrel）
#
# 原图来自参考设计稿 design/aeronova-website.html 的配图。同一张原图取不同
# 焦点/缩放，产出的是两张构图不同的裁切——比在多个卡片上重复同一张图专业，
# 也比凭空生成更可信。客户给真图后，改这里的 src 重跑即可，站点路径不变。
#
#   out   : 槽位路径（不带扩展名；输出统一 .jpg）
#   src   : 原图路径（相对站点 media/ 目录，或绝对路径）
#   focus : 保留区域的中心，0–1 归一化坐标
#   zoom  : 1.0 为整幅，>1 放大后再裁（数字越大看得越近）
#   cut   : 先切掉底部的比例（默认 0.13，用来去掉生成图右下角的水印）

photos:
