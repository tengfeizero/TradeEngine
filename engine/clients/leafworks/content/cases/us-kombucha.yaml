  title:
    en: Case — Cutting turbidity in a kombucha green tea base
    zh: 案例——把康普茶绿茶基底的浊度降下来
  description:
    en: A cold-brew cut with a declared particle profile and a 5 NTU target cut filtration cost 22% and extended shelf life to nine months.
    zh: 有明确碎度规格的冷萃切叶与 5 NTU 浊度目标，让过滤成本降 22%，货架期延至九个月。
