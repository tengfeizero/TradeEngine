  name:
    en: Green Tea
    zh: 绿茶
  desc:
    en: Pan-fired and oven-dried lots from Hangzhou, Anji and Huangshan. Spring pluck only, packed at 4.5% moisture and cold-stored from June.
    zh: 杭州、安吉、黄山的炒青与烘青。只做春茶，4.5% 含水率装箱，6 月起进冷库。
