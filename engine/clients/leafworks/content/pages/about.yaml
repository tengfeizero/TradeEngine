slug: about
status: published
title:
  en: A blending bench that got out of hand
  zh: 一张失控的拼配台
summary:
  en: Fifteen years, three people who still cup every lot, and a business built on saying which part of the job we are not doing.
  zh: 十五年，三个至今仍逐批杯测的人，以及一门建立在「说清自己不做什么」上的生意。
cover: media/lab/blending.jpg
updated_at: 2026-10-16
blocks:
  - type: richtext
    title:
      en: Started by three people who could not find the tea they wanted to sell
      zh: 三个找不到「想卖的那款茶」的人开的头
    body:
      en: |
        In 2009 we were buying tea for a small chain of tea houses in Hangzhou and could not get consistent leaf. One lot was good, the next was a different tea with the same name, and the supplier's answer was always that the weather had changed. It had — but the buyer still had a menu to print.

        So we started buying by lot, writing down what we bought, and blending to a target cup rather than to a price. The first customer was a hotel that wanted the same breakfast tea in three cities. The second was a German retailer that wanted to see the pesticide report before it would talk about price. Both are still customers.

        We have never owned a garden, and we stopped apologising for it. Buying from eleven gardens and co-operatives means we can change a lot when one fails, and it means the person who knows why a tea tastes the way it does is the person blending it, not a marketing department.
      zh: |
        2009 年，我们在为杭州几家茶馆采购，始终拿不到稳定的叶子。这批好，下批是同一个名字的另一种茶，供应商的回答永远是「天气变了」。天气确实变了，但买家还有一份菜单要印。

        于是我们改成按批采购、把买到的写下来、按目标风味而不是按价格拼配。第一个客户是一家酒店，要在三个城市喝到同一款早餐茶。第二个是一家德国零售商，要先看农残报告才谈价格。两家到现在都还在。

        我们从没有过自己的茶园，也不再为此道歉。从十一家茶园与合作社采购，意味着一批出问题时我们能换，也意味着真正懂这杯茶为什么是这个味的人，是拼配的人，不是市场部。
