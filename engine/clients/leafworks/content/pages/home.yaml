slug: home
status: published
title:
  en: Private-label tea development and packing in Hangzhou
  zh: 杭州的茶叶开发与自有品牌包装
summary:
  en: Thirty-eight base lots, an in-house blending bench and 300 kg minimums. We develop the tea your brand sells, and we put the numbers on paper.
  zh: 三十八个基底批次、自有拼配台、300 公斤起订。我们开发你品牌要卖的茶，并把数字写在纸上。
updated_at: 2026-10-22
blocks:
  - type: hero
    badge:
      en: Hangzhou · private-label tea since 2009
      zh: 杭州 · 自有品牌茶，始于 2009
    headline:
      en: Tea, {developed}.
      zh: 茶，是{开发}出来的。
    sub:
      en: We are not a tea garden. We are the bench between the garden and your shelf — thirty-eight base lots, a lab that cups blind, and a packing hall that will run 300 kilograms without asking you to buy a tonne.
      zh: 我们不是茶园。我们是茶园与你货架之间的那张台子——三十八个基底批次、一间盲评的实验室、一条 300 公斤就能开的包装线，不需要你先买一吨。
    cta_text:
      en: Start with a brief
      zh: 从一份需求开始
    cta_href: "/private-label/"
    cta2_text:
      en: Explore the six teas
      zh: 看六类茶
    cta2_href: "/products/"
    image: media/hero/bench.jpg
