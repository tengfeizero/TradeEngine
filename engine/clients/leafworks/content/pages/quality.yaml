      en: We do not own a garden, so what we can show you is the part we do control — the bench, the lab, the packing hall, and the certificates that cover them.
      zh: 我们没有自己的茶园，所以能给你看的是我们真正控制的部分——拼配台、实验室、包装车间，以及覆盖这些环节的证书。
