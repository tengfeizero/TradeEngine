  - type: richtext
    title:
      en: Three numbers we will not negotiate
      zh: 三个不商量的数字
    lead:
      en: Most of our specification is a conversation. These three are not, because each of them has already cost a customer a container.
    body:
      en: |
        **Anthraquinone, 0.02 mg/kg.** The EU MRL for anthraquinone in tea is the single most common reason Chinese tea is rejected at Rotterdam, and it is not a pesticide in the usual sense — it comes from smoke, exhaust and some packaging materials. Tea that has been dried over a wood fire, or stored next to a diesel generator, can fail without any farmer doing anything wrong. Our lots are hot-air dried and tested per lot; anything at or above the limit does not ship, and we tell the buyer the volume is short rather than blending it down.

        **Moisture, 4.5 percent for green and 5 percent for oolong.** Above that, the tea does not fail a test — it just tastes stale four months earlier than the shelf life claims, which is worse, because the complaint arrives after the pallet has been paid for. We measure at packing and again on the retained sample at six months.

        **Total plate count under 10⁴ CFU/g.** Tea is an infusion, not a ready-to-eat food, so there is no legal limit in most markets. Buyers still specify it, and a count above 10⁴ usually means the packing hall's humidity control has drifted. It is a leading indicator for the whole line, which is why we treat it as a stop rather than a warning.
      zh: |
        **蒽醌，0.02 毫克/公斤。** 欧盟对茶叶蒽醌的限量，是中国茶在鹿特丹被拒最常见的原因；它不是通常意义上的农药——来自烟、尾气与某些包装材料。用柴火烘干、或与柴油发电机放在一起的茶，农户什么都没做错也可能超标。我们的批次用热风干燥并逐批检测；达到或超过限量的不出货，我们会告诉买家这批量不够，而不是拼稀了事。

        **含水率，绿茶 4.5%、乌龙 5%。** 超过这个数，茶不会「检测不合格」——它只是比标注的保质期早四个月变陈，而这更糟，因为投诉到货已付款之后才来。装箱时测一次，留样满六个月再测一次。

        **菌落总数低于 10⁴ CFU/g。** 茶是冲泡饮品，不是即食食品，多数市场没有法定限量。但买家会写进规格，而超过 10⁴ 通常意味着包装车间的湿度控制漂了。它是整条线的先行指标，所以我们按停线处理，不按警告。
  - type: process
    title:
      en: When a lot fails
      zh: 一批不合格时
    intro:
      en: The sequence, including who pays. We have run this eleven times since 2019, and it has never taken longer than nine days.
      zh: 顺序，以及费用归属。2019 年以来执行过十一次，最长一次九天。
    steps:
      - title:
          en: Hold
          zh: 扣货
        body:
          en: The lot is moved to a red-taped area and its transaction documents are frozen. Nothing is re-blended to dilute a failing result — that is the one shortcut that turns a reject into a recall.
          zh: 该批移入红标区，单证冻结。绝不通过拼配稀释不合格结果——那是把「退货」变成「召回」的唯一捷径。
      - title:
          en: Re-test
          zh: 复检
        body:
          en: A second sample from the same lot goes to an accredited third-party lab, at our cost. If the two labs disagree, the third lab decides.
          zh: 同批第二份样送认可第三方实验室，费用我们出。两家结果不一致时，以第三家为准。
      - title:
          en: Root cause
          zh: 定位原因
        body:
          en: Drying method, storage, packaging or the garden itself. Anthraquinone almost always traces to drying or storage, which means it is our process, not the farmer's.
          zh: 干燥方式、仓储、包装，还是茶园本身。蒽醌几乎总能追到干燥或仓储——也就是我们的工艺，不是农户的问题。
      - title:
          en: Replace or refund
          zh: 换货或退款
        body:
          en: If the ship date allows, we replace from stock at our cost. If not, we refund the deposit and give you the failing report so you can tell your own customer the truth.
          zh: 船期允许就从现货补发，费用我们出；不允许就退定金，并把不合格报告给你，让你能对自己的客户讲实话。
      - title:
          en: Change the process
          zh: 改工艺
        body:
          en: Every failure produces a written change to the process, not a memo. Two of the eleven were storage issues; both led to a change in how pallets are sited in the warehouse.
          zh: 每次不合格都产生一份书面的工艺变更，不是一张通知。十一次里有两次是仓储问题，都改成了托盘的堆位规则。
  - type: factory
