  - type: faq
    title:
      en: Testing questions buyers actually ask
      zh: 买家真正会问的检测问题
    items:
      - q:
          en: Can we nominate the laboratory?
          zh: 可以指定实验室吗
        a:
          en: Yes, if it is accredited to ISO 17025 and can take the sample within seven days. You pay the difference if it costs more than our in-house panel; we pay if it finds something we missed.
          zh: 可以，前提是通过 ISO 17025 认可、能在七天内接样。费用高于我们自有面板的部分由你承担；若查出我们漏掉的问题，由我们承担。
      - q:
          en: Do you test every lot for everything?
          zh: 每批都全项检测吗
        a:
          en: No, and nobody does. Every lot gets the 510-analyte pesticide panel, moisture, and micro. Heavy metals and anthraquinone are every lot for EU-bound tea, quarterly for other markets. Sensory is every lot — it is the cheapest test we run and the one that catches most problems.
          zh: 不是，也没有人这样做。每批做 510 项农残、含水率与微生物。发往欧盟的茶每批做重金属与蒽醌，其他市场按季度。感官每批都做——它是最便宜的检测，也是抓出问题最多的那一项。
      - q:
          en: What is the CoA format?
          zh: 检测报告是什么格式
        a:
          en: One page per lot, PDF with signature. Lot code, garden, pluck date, results against spec with pass or fail, and the name of the analyst. Buyers often need it in their own template; send yours and we will fill it.
          zh: 每批一页，PDF 并签章：批次号、产地、采摘日期、对照规格的逐项结果与判定，以及检测人姓名。买家常常需要用自己的模板，发来我们照填。
      - q:
          en: How do you handle a customer complaint after delivery?
          zh: 到货后的投诉怎么处理
        a:
          en: Send the lot code and photographs. Retained samples are kept 24 months, so we can cup the same lot you have. If it is our fault, we credit the invoice; we do not ask for the tea back, because return freight on a spoiled pallet costs more than the tea.
          zh: 提供批次号与照片。留样保存 24 个月，我们能喝到你手上的同一批。确属我方问题就冲抵货款；不要求退回，因为坏掉的一托运回来的运费比茶还贵。
  - type: cta
    title:
      en: Ask for a sample CoA before you order
      zh: 下单前先要一份样本检测报告
    body:
      en: We will send a redacted CoA from a recent lot, the full analyte list, and the sampling plan we use on arrival. Your QA team can mark it up before the first order rather than after.
      zh: 我们可发一份近期批次（脱敏）的检测报告、完整检测项清单与到货抽样计划。让你的质量团队在第一单之前批注，而不是之后。
    cta_text:
      en: Request the documents
      zh: 索取文件
    cta_href: "/contact/"
