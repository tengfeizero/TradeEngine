slug: quality
status: published
title:
  en: Quality control, and the three results that stop a lot
  zh: 品控，以及会让一批货停下的三个结果
summary:
  en: The pesticide panel, the moisture meter, the micro lab and the cupping table — plus what happens, and who pays, when a lot fails.
  zh: 农残面板、水分仪、微生物实验室与杯测台——以及一批不合格时发生什么、由谁承担。
