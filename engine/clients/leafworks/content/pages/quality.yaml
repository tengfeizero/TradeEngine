    retention:
      en: Every lot keeps a 500 g sample at 18 °C in the dark for 24 months, and we cup it again at six and at twelve months. When a buyer writes that the tea "tastes older than the date on the bag", that sample is how we answer with evidence instead of an apology.
      zh: 每批留 500 克样，18 ℃ 避光保存 24 个月，并在第六与第十二个月各复杯一次。当买家来信说「茶比袋上的日期更陈」，那份留样就是我们拿出证据的地方，而不是只有一句道歉。
