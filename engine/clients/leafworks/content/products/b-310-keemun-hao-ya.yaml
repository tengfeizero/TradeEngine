description:
  en: |
    Keemun is usually sold as "the champagne of black tea", which tells a buyer nothing. What matters in a blend is how it behaves against Assam and Ceylon: Keemun gives aroma and a dry finish, but body comes from somewhere else. Put more than 40 percent Keemun in a breakfast blend and it goes thin in the cup, which is why our blending bench treats it as a top note rather than a base.

    Hao Ya A is the small-leaf grade — roughly 0.8 to 1.2 mm, golden tips present but not dominant. It takes milk badly, so we do not recommend it for food service unless the menu is black tea served plain. For a gift tin or a specialty shelf it is the easiest sale in the category.
  zh: |
    祁门常被叫作「红茶里的香槟」，这句话对买家没有信息量。拼配里真正要紧的是它与阿萨姆、锡兰的关系：祁门给香气和收口的干爽，厚度得从别处来。早餐拼配里祁门超过 40%，杯中就会发空——所以我们的拼配台把它当顶香，不当基底。

    毫芽 A 是小叶等级，约 0.8 至 1.2 毫米，金毫有但不占主导。它吃奶吃得不好，所以除非菜单上的红茶是清饮，我们不建议餐饮渠道用它。礼盒与精品货架上，它是这个品类里最好卖的一支。

