subtitle:
  en: A workhorse base for chai, milk tea and RTD — bought at auction, re-packed under our FSSC system
  zh: 供香料茶、奶茶与即饮的基底——拍卖采购，在我们的 FSSC 体系下分装
summary:
  en: Grown in Assam, bought through a Kolkata broker, re-packed in Hangzhou. We say so because your customer will ask, and because the colour consistency is the reason to buy it.
  zh: 阿萨姆种植、经加尔各答经纪商采购、杭州分装。我们把这条链路写明，因为你的客户会问；也因为批次色泽稳定才是买它的理由。

description:
  en: |
    This is the only product on our list that is not Chinese. Chinese buyers of milk tea and RTD need a strong, cheap, high-extraction base, and Chinese leaf cannot hit the price. We buy BP1 at auction in Kolkata, ship it to Hangzhou in 40 kg sacks, and re-pack it under the same FSSC 22000 system as our own tea. Origin is declared on every document — an FTA claim on a re-packed third-country tea is the fastest way to lose a customer at customs.

    The specification that matters is not "Assam" but the numbers: 31 to 33 percent extraction at 90 °C in five minutes, and a liquor colour that stays within a narrow band lot to lot. A chai brand switching base because the colour drifted is a brand whose product looks different on shelf. We keep a retained sample of every lot for 24 months so a colour complaint can be traced to a specific sack.
  zh: |
    这是我们清单上唯一不是中国的产品。做奶茶与即饮的中国买家需要一个浓、便宜、萃取率高的基底，国产叶子到不了那个价。我们在加尔各答拍卖买 BP1，40 公斤袋运到杭州，在我们的 FSSC 22000 体系下分装。产地写在每一份单证上——给第三国分装的茶套用自贸协定优惠，是在海关丢客户最快的方式。

    真正重要的规格不是「阿萨姆」，是数字：90 摄氏度、五分钟萃取率 31% 至 33%，以及批与批之间汤色落在很窄的区间。一个香料茶品牌如果因为基底换批导致颜色漂移，货架上的产品看起来就变了一个样。每批留样 24 个月，颜色投诉能追到具体哪一袋。

