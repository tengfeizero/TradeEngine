summary:
  en: The green tea we sell most of. Longjing 43 from Fuyang — same cultivar as Xihu, a third of the price, and we will say that on the invoice.
  zh: 我们出货最多的绿茶。富阳的龙井 43——与西湖同品种，价格是三分之一，这一点我们写在发票上。

description:
  en: |
    Buyers ask for "Longjing" and mean two different things: the 1,680 hectares around West Lake with a designation behind it, and the cultivar that is now grown across Zhejiang. We sell the second one, and we put the growing district on every document. If your label says Xihu and the leaf came from Fuyang, that is a misdescription in the EU and a recall in the US. We would rather lose the order.

    The lot is picked as one bud and one leaf in the ten days before Qingming, withered four hours, then fired by hand in a 180 °C electric wok in four passes. Hand-firing is slower than the machine line and gives the flat, pressed shape that a machine press only imitates. Moisture leaves the plant at 4.2 percent and the lot goes into cold store at 4 °C, which is why a July shipment tastes like a May one.
  zh: |
    买家说「龙井」，其实指两样东西：西湖边那 1,680 公顷、有原产地保护的名头，和如今种遍浙江的这个品种。我们卖后者，并且把产区写在每一份单证上。如果你的标签写西湖、叶子来自富阳，在欧盟是虚假描述，在美国是召回。这种单子我们宁可不接。

    这一批是清明前十天的「一芽一叶」，萎凋四小时，再在 180 摄氏度电炒锅里分四道手工辉锅。手工比机器线慢，但能做出那口扁平压合的形状，机器压形只是模仿。出厂含水率 4.2%，随即进 4 摄氏度冷库——所以七月的货喝起来像五月的。

