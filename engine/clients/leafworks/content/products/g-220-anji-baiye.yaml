summary:
  en: The tea that converts people who say they do not like green tea. 5.8% amino acids, almost no astringency, and a colour that photographs well in a clear glass.
  zh: 能让「我不爱喝绿茶」的人改口的那一款。氨基酸 5.8%，几乎不涩，汤色在玻璃杯里很上相。

description:
  en: |
    Anji Baiye is a cultivar, not a white tea. The bush produces pale leaves for about three weeks in spring because of a temperature-sensitive chlorophyll trait; picked in that window and processed green, the result is high theanine and very little catechin bitterness. Picked a week late, it is ordinary tea. This is the constraint that sets our shipping calendar.

    For private label it does one job well: it is the green tea you can put in front of a customer who found your last green tea too bitter. We recommend it as the second SKU in a range, not the first — it sells on taste, not on name recognition.
  zh: |
    安吉白叶是品种，不是白茶。因为叶绿素对温度敏感，春天大约三周里新叶会发白；在这段时间采下、按绿茶工艺做，茶氨酸高、儿茶素苦涩极低。晚采一周，就是普通茶。这个约束决定了我们的发货日历。

    做自有品牌它只干一件事，但干得好：这是你能端给「上一款绿茶太苦」的客户的那杯。我们建议把它放在产品线的第二支，不是第一支——它靠口味卖，不靠名字。

