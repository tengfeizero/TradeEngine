description:
  en: |
    Light-aroma Tieguanyin has a reputation problem in Europe: the cheapest versions are unroasted, packed young and taste of hay by the time they clear customs. The fix is not more roast, it is rest. We hold every lot six weeks after the final firing so the roast integrates, then pack at 5 percent moisture in foil.

    Nanyan leaf is thicker than the lowland material and takes a second and third infusion without going flat, which changes the cost per cup for a food-service account. If your customer is comparing on price per kilogram alone, this is the wrong product — the right comparison is price per litre of acceptable tea.
  zh: |
    清香型铁观音在欧洲有个口碑问题：最便宜的版本不焙火、很早就装箱，清关时已经有干草味。解法不是加重火功，是静置。每批最后一道焙火后我们放六周，让火气融合，再以 5% 含水率铝箔装箱。

    南岩的叶子比低山原料厚，第二、三泡不发空——这对餐饮客户来说直接改变每杯成本。如果你的客户只按每公斤比价，这款是错的产品；正确的比法是「每升合格茶汤的成本」。

