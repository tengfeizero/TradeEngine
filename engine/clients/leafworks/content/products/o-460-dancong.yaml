description:
  en: |
    Dancong is sold on aroma type — mi lan, ya shi, huang zhi — and the names are only half true. Two bushes of the same type, fifty metres apart, make different tea; the old bush on the rock gives the honey note, the younger one gives flowers and a thinner body. We buy by bush, keep the lots separate, and put the bush number on the bag.

    At 22 kg a year this is not a volume product and we do not pretend otherwise. It exists for a gift range or a tea house that wants one thing nobody else on the shelf has. If you need 300 kg of "dancong", we will sell you a blended lot and call it blended.
  zh: |
    单丛按香型卖——蜜兰、鸭屎、黄枝——而这些名字只对一半。同一香型的两株树，隔五十米，做出来是不同的茶；岩上老树给蜜，小树给花香和更薄的汤感。我们按株采购、按株存放，把株号写在袋子上。

    一年 22 公斤，这不是走量产品，我们也不假装它是。它的用处是礼盒，或者一间想让货架上有一件别人没有的东西的茶馆。如果你要 300 公斤「单丛」，我们会卖你一批拼配的，并且告诉你这是拼配的。

