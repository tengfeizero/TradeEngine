summary:
  en: Wo dui in 2019, pressed or loose, stored at 23 °C and 55% RH since. Boring on purpose — a shou that tastes the same in June as it did in January.
  zh: 2019 年渥堆，压饼或散茶，此后 23 摄氏度、55% 湿度存放。故意做得「无聊」——六月与一月喝起来一样。

description:
  en: |
    Shou pu-erh buyers fall into two groups: the ones who want a story about a cave, and the ones who want a base for a blended tea bag that will not change character between shipments. This lot is for the second group. Wo dui in 2019, turned twice, then stored dry in Menghai with monthly temperature and humidity logs.

    The flavour is what the trade calls clean shou — dark wood, dates, a little camphor, no fishiness, no wet-storage mustiness. It extracts fast, so in a tea bag it is usually blended with a lighter leaf to slow it down. We keep the loose and pressed versions as separate lots even though they come from the same pile, because they age differently.
  zh: |
    买熟普的人分两类：一类想听一个关于山洞的故事，一类想要一个批次之间性格稳定的袋泡茶基底。这一批是给后者的。2019 年渥堆，翻堆两次，之后在勐海干仓存放，每月记录温湿度。

    滋味是行内说的「干净熟茶」——深色木质、枣香、一点樟香，没有鱼腥，没有湿仓霉味。它出味快，做袋泡通常要拼一点轻发酵的叶子拖住。散茶与紧压我们按两批管理，虽然同出一堆，因为陈化速度不一样。

