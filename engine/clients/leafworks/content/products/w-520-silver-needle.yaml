summary:
  en: Fuding buds only, 92% bud coverage, and a process with three steps — which is why the price is honest and the flavour is quiet.
  zh: 只用福鼎芽头，芽头占比 92%，工艺只有三步——所以价格诚实，滋味安静。

description:
  en: |
    White tea is the easiest category to fake and the easiest to explain. There is no firing, no rolling, no oxidation step to hide behind: pick buds, wither them in sun and air, dry them slowly. What separates a good lot is the picking — buds only, no leaf — and the weather during the two days of withering.

    In a beverage application the quietness is the point. Cold-brewed at 4 °C for eight hours, Silver Needle gives a pale, sweet base with almost no bitterness, so a formulator does not need to add sugar to cover it. We supply it as a base for two kombucha producers, both of whom specify the same two numbers: 0.8% soluble solids at 1:50 and turbidity under 5 NTU after filtration.
  zh: |
    白茶是最容易造假、也最容易讲清楚的品类。不炒、不揉、没有发酵环节可以藏：采芽、日晒与阴凉萎凋、慢慢烘干。决定一批好坏的是采摘——只要芽，不要叶——以及那两天萎凋的天气。

    用在饮料里，「安静」正是它的价值。4 摄氏度冷萃八小时，银针给出浅色、带甜、几乎没有苦味的基底，配方师不需要靠加糖去盖。我们给两家康普茶厂供基底，两家指定的都是同样两个数字：1 比 50 冲泡可溶性固形物 0.8%，过滤后浊度低于 5 NTU。

