summary:
  en: The caffeine-free SKU most ranges need and most suppliers treat casually. Same 510-analyte panel as our tea, and an SO2 result we publish.
  zh: 大多数产品线都需要、大多数供应商却做得很随意的那支无咖啡因单品。与茶叶同做 510 项农残面板，二氧化硫结果公开。

description:
  en: |
    Chrysanthemum is where Chinese suppliers cut corners most often, because the buyer usually treats it as a cheap filler SKU. Two shortcuts are common: sulfur fumigation to keep the colour bright, and a lighter pesticide panel than the leaf tea gets. Both show up in the cup — sulfur gives a sharp, medicinal edge, and residues are the first thing an EU lab finds.

    We buy whole heads from Tongxiang, dry them at 45 °C, and test every lot on the same 510-analyte panel as our tea, plus a separate SO2 check. The result goes on the CoA. If a lot fails either, it does not ship, and we tell the buyer why the volume is short rather than substituting a different lot.
  zh: |
    花草类是中国供应商最容易偷工的地方，因为买家通常把它当便宜的填充 SKU。两种捷径很常见：用硫熏保持颜色鲜亮，以及用比茶叶更宽松的农残面板。两者都会在杯里显出来——硫给一股尖利的药味，而农残是欧盟实验室最先查出的东西。

    我们从桐乡采购整朵，45 摄氏度烘干，每批与茶叶同做 510 项农残面板，另做二氧化硫单项。结果写在检测报告上。任一项不合格就不发货，我们会告诉买家为什么这批量不够，而不是换一批货顶上。

