seo:
  title:
    en: Case study — cargo fleet keeps 88% capacity at 50°C
    zh: 客户案例——50 度环境下载货车队保持 88% 容量
  description:
    en: Insulated battery compartment and a rewritten charging profile lifted 18-month capacity retention from 70% to 88% across a 240-vehicle Dubai fleet.
    zh: 电池隔热仓与重写的充电策略，把迪拜 240 台车队 18 个月容量保持率从 70% 提升到 88%。
