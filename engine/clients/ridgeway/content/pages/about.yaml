  - type: testimonials
    kicker:
      en: Buyer voices
      zh: 买家怎么说
    title:
      en: Three buyers, three different problems
      zh: 三个买家，三个不同的问题
    intro:
      en: Names and companies are shown with permission. Each quote links to the product it is about, so you can check the specification yourself.
      zh: 姓名与公司经对方同意后展示。每条都链到对应产品，规格你可以自己去核。
    items:
      - quote:
          en: We moved a 900-unit gravel run to Ridgeway after our previous supplier missed a paint match twice. The first 20 frames came with D65 photos before they painted the rest — nobody had done that for us before.
          zh: 上一家供应商两次色差没解决，我们把 900 台的砾石车订单转到了 Ridgeway。他们先拍 20 台在 D65 光源下的照片给我们确认，才继续喷剩下的——之前没人这样做过。
        author: Jonas Berg
        role:
          en: Product manager
          zh: 产品经理
        company: Nordvelo AB
        country: SE
        date: "2026-08-14"
        product: g500-gravel
      - quote:
          en: The traceability card is the reason we stayed. When two frames came back from a dealer with a cracked dropout, they pulled the weld records and the tube heat number in a day, and shipped replacements before we finished the claim report.
          zh: 留住我们的是那张追溯卡。有两台车架被经销商退回、后钩开裂，他们一天内调出了焊接记录与管材炉号，我们的索赔报告还没写完，替换件已经发出。
        author: Marta Ruiz
        role:
          en: Supply chain lead
          zh: 供应链负责人
        company: Ciclo Urbano S.L.
        country: ES
        date: "2026-05-22"
        product: r320-e-city
      - quote:
          en: We asked for a cargo platform with a 180 kg payload and our own deck geometry. They sent a fixture drawing in four days and a rideable prototype in six weeks — the timeline they quoted was the timeline they kept.
          zh: 我们要一个载重 180 公斤、货台几何自定的载货平台。四天给了夹具图，六周给了可骑样车——报的排期就是守住的排期。
        author: Dirk Albers
        role:
          en: Founder
          zh: 创始人
        company: LastMile Cargo GmbH
        country: DE
        date: "2026-02-09"
        product: c40-cargo-longtail
  - type: cta
    title:
      en: Send the drawing. We will tell you what it costs to build.
      zh: 把图纸发来，我们告诉你造出来要多少钱。
    body:
      en: If the geometry will not weld at your target price, we say that too — before tooling, not after the first container.
      zh: 如果这个几何在你目标价内焊不出来，我们也直说——在开模之前，不是第一柜之后。
    cta_text:
