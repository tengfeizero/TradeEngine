  - type: richtext
    title:
      en: What we do not do
      zh: 我们不做什么
    body:
      en: |
        **We do not build complete bikes for our own brand.** We have no house brand, and we will not compete with the people who pay us. If you see a Ridgeway-branded bike in a shop, it is not ours.

        **We do not broker.** Every frame we quote is welded in our own plant. If a platform is outside our capability — carbon frames, for instance — we say so and decline the order rather than subcontracting it quietly.

        **We do not quote prices we cannot hold.** FOB numbers are valid for 30 days and tied to a specific specification. If aluminium or cell prices move beyond 5%, we come back to you before production rather than after.
      zh: |
        **我们不做自有品牌整车。** 我们没有自有品牌，也不会和付钱给我们的人竞争。你在店里看到挂 Ridgeway 标的整车，那不是我们的。

        **我们不做倒手。** 每一台报出去的车架都在自己厂里焊。超出能力的平台——比如碳纤维车架——我们直说并拒单，不会悄悄转包。

        **我们不报守不住的价格。** FOB 报价有效期 30 天，且对应具体规格。铝价或电芯价格波动超过 5%，我们在生产前找你，而不是生产后。
  - type: image_text
    title:
      en: How we work with a new brand
      zh: 我们怎么和新品牌合作
    body:
      en: |
        The first order is usually the slowest, and it should be. We start with your drawing or ours, agree the fixture offsets, and build two frames before cutting a full lot.

        Those two frames go to you, not to a lab. Your mechanic rides them, your painter checks the finish, and only then do we set a production date. It costs three weeks and saves the container.
      zh: |
        首单通常最慢，也应该最慢。从你的图纸或我们的图纸开始，先确认夹具偏置，再在整批下料之前做两台样架。

        这两台寄给你，不进实验室。你的技师骑，你的涂装师看漆面，之后才排产。多花三周，省下一整柜。
    bullets:
