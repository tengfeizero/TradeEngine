title:
  en: About Ridgeway
  zh: 关于岭道
summary:
  en: Started in 2011 as a frame welding shop for three local brands. Today two plants, 380 people, and 45 export markets — still doing our own welding.
  zh: 2011 年从给三家本地品牌做车架焊接起家。今天两个厂区、380 人、45 个出口市场，焊接仍然自己做。
cover: media/products/cat-folding.jpg
updated_at: 2026-10-18
blocks:
  - type: image_text
    title:
      en: We started with the hardest part
      zh: 我们从最难的那道工序开始
    body:
      en: |
        In 2011 we were a welding shop: three jigs, eleven welders, and three local brands who needed frames they could not get from the big factories at their volume.

        Painting, assembly and export came later — welding came first, which is why the two joints that fail catastrophically are still checked by hand on every frame rather than sampled. A factory that started with assembly treats the frame as a purchased part. We never could.
      zh: |
        2011 年我们是个焊接车间：三台夹具、十一个焊工、三家本地品牌——他们那个量级，大厂不接。

        涂装、装配、出口都是后来才有的，焊接在最前。这也是为什么两处会「灾难性失效」的接头，我们今天仍逐台手检而不抽检。从装配起家的工厂，把车架当外购件；我们从来没这个条件。
    bullets:
      - en: Frame welding in-house since 2011
        zh: 2011 年起车架焊接自有
