  - type: faq
    title:
      en: Verification
      zh: 核验方式
    items:
      - q:
          en: How do I verify a certificate?
          zh: 如何核验证书？
        a:
          en: Take the registration number from the card and search it on the issuer's site (TÜV Rheinland, SGS, amfori). If it does not come up, ask us for the scanned original.
          zh: 取卡片上的注册编号，在发证机构官网（TÜV 莱茵、SGS、amfori）查询。查不到可直接向我们索取原件扫描件。
      - q:
          en: Do you have EN 15194 for every e-bike platform?
          zh: 每个电助力平台都有 EN 15194 吗？
        a:
          en: Yes, as a complete EPAC including the 25 km/h cut-off under load. The report covers the frame, drive unit and battery as a system, not the frame alone.
          zh: 有，且是整车型式，包含负载下的 25 公里限速表现。报告覆盖车架、驱动与电池作为系统的组合，不只是车架。
      - q:
          en: Can certificates be issued under my company name?
          zh: 证书能挂在我们公司名下吗？
        a:
          en: For OEM builds, yes — we act as the manufacturer and your entity appears as the brand holder on the declaration. This takes 4–6 weeks and requires your company registration documents.
          zh: 做 OEM 可以——我们作为制造商，你的主体作为品牌持有方出现在声明上。周期 4–6 周，需要你的公司注册文件。
      - q:
          en: What if my market needs a certification you do not hold?
          zh: 我的市场需要你没有的认证怎么办？
        a:
          en: We will quote the testing cost and timeline before you commit. If the volume does not justify it, we say so rather than absorbing it into the unit price.
          zh: 你决定前我们先报检测费用与周期。若量级不划算，我们直说，而不是摊进单价里。
  - type: inquiry
