updated_at: 2026-10-22
blocks:
  - type: richtext
    title:
      en: Why we publish the numbers
      zh: 为什么公开证书编号
    body:
      en: |
        A certificate logo proves nothing — anyone can paste one onto a page. What a buyer can act on is the issuer, the registration number and the validity window, because those take a minute to check on the certifier's own site.

        Everything below is current. Expired certificates drop off this page at build time rather than sitting here as decoration.
      zh: |
        证书图标证明不了什么——谁都能贴一张。买家真正能用的是发证机构、注册编号与有效期，因为这些一分钟内就能在发证机构官网核实。

        下面每一张都是现行版本。过期证书在构建时自动从本页移除，而不是留着当装饰。
