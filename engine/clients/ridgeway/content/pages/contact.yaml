title:
  en: Contact
  zh: 联系我们
summary:
  en: Send your drawing or platform, annual volume and target market. We reply within 12 hours on business days with an FOB estimate and a tooling position.
  zh: 发来图纸或平台、年采购量与目标市场。工作日 12 小时内回复 FOB 估价与开模方案。
updated_at: 2026-10-22
blocks:
  - type: image_text
    title:
      en: Talk to the people who build it
      zh: 直接和造车的人谈
    body:
      en: |
        Your inquiry goes to a named account manager, not a shared inbox. Messages sent after 18:00 China time are answered the next morning.

        What speeds up a quote: frame material and geometry sheet, annual volume, target market, certification requirements, and whether you need private-label packaging. Without those we can only give a range.
      zh: |
        询盘直接落到具体客户经理，不是一个公共邮箱。北京时间 18:00 之后提交的，次日上午回复。

        能让报价快起来的：车架材质与几何表、年采购量、目标市场、认证要求，以及是否需要自有品牌包装。缺这些我们只能给区间价。
    bullets:
