    image: media/products/cat-city.jpg
  - type: faq
    title:
      en: Before you write
      zh: 发信之前
    items:
      - q:
          en: Do you send free samples?
          zh: 寄免费样品吗？
        a:
          en: Not for custom builds. Stock platforms are available at 2× FOB with freight collect, and the difference is credited against your first bulk order.
          zh: 定制款不免费。现有平台按 FOB 两倍价提供，运费到付，差额在首个大货订单中抵扣。
      - q:
          en: What is the smallest order you will quote?
          zh: 最小报价量是多少？
        a:
          en: 30 units for cargo platforms, 50 for EPAC, 100 for mechanical frames, 200 for kids. Below those numbers the tooling and inspection cost dominates the unit price.
          zh: 载货平台 30 台、电助力 50 台、机械车架 100 台、童车 200 台。低于这些数字，开模与检验成本会主导单价。
      - q:
          en: Can you quote in EUR or USD?
          zh: 可以报欧元或美元吗？
        a:
          en: Both, and RMB. We quote in the currency of your PO; the exchange basis is stated on the offer so neither side is surprised at settlement.
          zh: 美元、欧元与人民币都可以。按你订单的币种报，报价单上写明汇率基准，结算时双方都不会意外。
  - type: inquiry
