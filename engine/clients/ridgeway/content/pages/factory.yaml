  - type: process
    title:
      en: From tube to container
      zh: 从管材到货柜
    intro:
      en: Six stages, each with a recorded check. Your specification follows the lot card, not somebody's memory.
      zh: 六个环节，每步都有记录检查。你的规格跟着批次卡走，不靠谁的记忆。
    steps:
      - title:
          en: Cutting & mitering
          zh: 下料与切口
        body:
          en: Tubes are cut on a CNC line and mitered to the drawing's angles. First article from each new setup is measured against the fixture offsets.
          zh: 管材在 CNC 线上切割，按图纸角度切口。每次换型的第一件都对照夹具偏置实测。
      - title:
          en: Welding
          zh: 焊接
        body:
          en: TIG welded on steel fixtures. Weld current, gas flow and jig number are recorded per frame; every 500th frame gets an X-ray seam check.
          zh: 钢制夹具上 TIG 焊接。每台的焊接电流、气体流量与夹具编号都有记录；每 500 台做一次焊缝 X 光检测。
      - title:
          en: Alignment & heat treatment
          zh: 校形与热处理
        body:
          en: Post-weld alignment on a granite table, then T6 heat treatment. Dropout spacing and head tube parallelism are measured, not judged by eye.
          zh: 焊后在花岗岩平台上校形，再做 T6 热处理。后钩间距与车头管平行度都是实测，不靠目测。
      - title:
          en: Painting & decals
          zh: 涂装与贴花
        body:
          en: Six-tank pre-treatment, powder or liquid top coat, then decals under clear coat. Your paint code and decal files are archived per customer.
          zh: 六槽前处理，粉末或液体面漆，贴花后罩清漆。你的色号与贴花文件按客户存档。
      - title:
          en: Assembly
          zh: 装配
        body:
          en: Two EPAC-dedicated lines for e-bikes. Torque values on stem, crank and brake bolts are set with calibrated tools and spot-checked each shift.
          zh: 电助力由两条专线装配。把立、曲柄、刹车螺栓的扭矩用校准工具设定，每班抽检。
      - title:
          en: Pre-delivery inspection
          zh: 出厂检验
        body:
          en: 100% ride test, brake and gear check, then AQL 2.5 sampling by a third party. Photos of the sealed container are sent before departure.
          zh: 100% 骑行测试、刹车与变速检查，再由第三方按 AQL 2.5 抽检。装柜铅封照片在发运前发送。
  - type: image_text
    title:
      en: Built for scale, checked like a small shop
      zh: 规模化生产，小作坊式检查
    body:
      en: |
        Volume is the easy part. The hard part is that a 5,000-unit run must be inspected as carefully as a 50-unit sample.

        Every batch carries a traceability card: tube heat number, weld operator, paint lot, assembly shift, and the inspector's initials. If a frame fails in your market two years later, we can pull the same card and tell you which shift built it.
      zh: |
        产能是容易的部分。难的是 5000 台的批量，要和 50 台样品一样认真检。

        每批都有追溯卡：管材炉号、焊工、涂装批次、装配班次、检验员签名。两年后车架在你的市场出问题，我们能调出同一张卡，告诉你哪个班次做的。
    bullets:
      - en: Traceability card per batch — tube lot to inspector
        zh: 每批一张追溯卡——从管材炉号到检验员
      - en: OEM and ODM, including private-label packaging
        zh: OEM 与 ODM，含自有品牌包装
      - en: Sea, rail and air freight; FOB Ningbo or Shanghai
        zh: 海运、铁路与空运；宁波或上海 FOB
      - en: 45–85 day lead time depending on platform
        zh: 交期 45–85 天，按平台不同
    image: media/products/cat-cargo.jpg
  - type: image_text
    title:
      en: Quality you can verify, not just claim
      zh: 可核验的质量，不只是宣称
    body:
      en: |
        We do not run a full test lab, and we say so. What we do run is a documented sampling programme with SGS and TÜV: frame fatigue, brake performance, battery safety, and paint adhesion, with reports tied to the lot number.

        Every shipment leaves with a Certificate of Analysis covering the tests your market requires. If your customs broker asks for EN 15194 documentation, it is already in the folder.
      zh: |
        我们不设完整实验室，这点直说。我们做的是与 SGS、TÜV 的固定抽检计划：车架疲劳、刹车性能、电池安全、涂装附着力，报告与批号绑定。

        每批出货附检测报告，覆盖你所在市场要求的项目。报关行要 EN 15194 文件时，它已经在资料夹里了。
    bullets:
      - en: Third-party sampling with SGS and TÜV
        zh: 与 SGS、TÜV 的第三方抽检
      - en: Report tied to the lot number, shipped with the goods
        zh: 报告与批号绑定，随货发出
      - en: EU MRL and EN 15194 documentation on file
        zh: 欧盟限值与 EN 15194 文件常备
      - en: Climate-controlled finished-goods warehouse
        zh: 恒温成品仓
