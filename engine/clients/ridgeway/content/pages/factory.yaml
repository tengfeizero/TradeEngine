    retention:
      en: Every lot keeps two frames and one painted sample for 24 months, keyed to the traceability card — if a frame fails in your market, we compare it against the same lot.
      zh: 每批留两台车架与一台涂装样件，保存 24 个月并与追溯卡绑定——车架在你的市场出问题，我们拿同批次对照。
  - type: faq
    title:
      en: Buyer questions
      zh: 买家常问
    items:
      - q:
          en: What is the real MOQ if I want my own geometry?
          zh: 要自有几何的话，真实起订量是多少？
        a:
          en: 100 units for mechanical frames and 50 for EPAC platforms. Below that we can still build from our existing geometry with your paint and decals, starting at 30 units for cargo.
          zh: 机械车架 100 台，电助力平台 50 台。低于这个量仍可用我们的现有几何加你的涂装与贴花，载货车型最低 30 台。
      - q:
          en: Who owns the drawing and the tooling?
          zh: 图纸与模具归谁？
        a:
          en: You own the drawing. Tooling is amortised into the unit price or paid upfront — if paid upfront, the tooling is yours and we will ship it to another factory on request.
          zh: 图纸归你。开模费可摊入单价或一次性支付——若一次性支付，模具归你，我们可按要求转移到其他工厂。
      - q:
          en: How do you handle a paint colour that does not match?
          zh: 色差怎么处理？
        a:
          en: First 20 frames of every batch are shot under D65 light against your approved sample and sent for confirmation before the run continues. A confirmed mismatch is repainted at our cost.
          zh: 每批前 20 台在 D65 光源下对照确认样拍照，确认后才继续生产。确认不符的由我们承担返喷费用。
      - q:
          en: Can you ship to a marketplace seller rather than a brand?
          zh: 可以直接发给平台卖家而不是品牌方吗？
        a:
          en: Yes, with neutral packaging and no factory marks, provided the certification documents are still filed under your entity.
          zh: 可以，中性包装、无工厂标识，前提是认证文件仍挂在你的主体名下。
      - q:
          en: What happens if a batch fails third-party inspection?
          zh: 第三方验货不合格怎么办？
        a:
          en: We rework or rebuild at our cost and cover the re-inspection fee. If it fails twice, you can cancel the balance without penalty.
          zh: 我们承担返工或重做，并支付复检费用。若两次不合格，你可无责取消余款。
