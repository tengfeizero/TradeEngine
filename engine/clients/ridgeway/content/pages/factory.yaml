title:
  en: Factory & production control
  zh: 工厂与生产控制
summary:
  en: 22,000 m² across two plants in Taizhou, eight assembly lines, 120,000 units a year. Frame welding and painting in-house, wheels and drivetrain sourced from Shimano and Novatec.
  zh: 台州两个厂区共 22,000 平方米，八条装配线，年产 12 万台。车架焊接与涂装自有，轮组与传动来自 Shimano 与 Novatec。
