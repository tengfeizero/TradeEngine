    kicker:
      en: Request a Quote
      zh: 获取报价
    title:
      en: Send your drawing, get a costed offer
      zh: 发来图纸，收到带成本的报价
    body:
      en: Include frame material, geometry sheet, annual volume, target market and certification requirements. We reply within 12 hours on business days with an FOB estimate and a tooling position.
      zh: 请注明车架材质、几何表、年采购量、目标市场与认证要求。工作日 12 小时内回复 FOB 估价与开模方案。
