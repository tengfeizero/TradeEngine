  - type: image_text
    kicker:
      en: Our Factory
      zh: 自有工厂
    title:
      en: A frame drawing you can actually revise
      zh: 一份真的能改的车架图纸
    body:
      en: |
        Most factories quote a geometry change as a new mould. Ours runs on adjustable jigs, so a head angle or reach change is a drawing revision — three weeks, not sixteen.

        You get the 2D drawing, the weld map and the fixture offsets with every platform, so your engineer can check our numbers against yours before tooling starts.
      zh: |
        多数工厂把改几何报成开新模。我们用的是可调夹具，改头管角或前伸量属于改图纸——三周，不是十六周。

        每个平台都交付 2D 图纸、焊接图与夹具偏置，你的工程师可以在开模前把我们的数字和自己的对一遍。
    bullets:
      - en: Adjustable jigs, geometry changes without new tooling
        zh: 可调夹具，改几何不需重开模
      - en: 2D drawing, weld map and fixture offsets included
        zh: 2D 图纸、焊接图与夹具偏置一并交付
      - en: ISO 4210-2 fatigue and impact testing per batch
        zh: 每批做 ISO 4210-2 疲劳与冲击测试
    image: media/products/cat-mountain.jpg
    cta_text:
      en: See how we build
      zh: 看看我们怎么生产
    cta_href: "/factory/"
  - type: features
    kicker:
      en: Built Responsibly
      zh: 负责任地造车
    title:
      en: Our commitment to the planet
      zh: 我们对这颗星球的承诺
    intro:
      en: Every Ridgeway is engineered for a decade of daily use — and for the day it is retired.
      zh: 每一辆 Ridgeway 都为十年的日常使用而设计，也为退役的那一天。
    items:
      - icon: recycle
        title:
          en: 92% recyclable frame sets
          zh: 92% 可回收车架
        body:
          en: Aluminium monocoque with water-based coating.
          zh: 铝合金单体壳，水性涂层。
      - icon: battery
        title:
          en: Second-life battery program
          zh: 电池二次利用计划
        body:
          en: Packs below 80% capacity go to off-grid storage partners.
          zh: 低于 80% 容量的电池包转投离网储能伙伴。
      - icon: users
        title:
          en: Fair-work audited lines
          zh: 公平劳动审核产线
        body:
          en: BSCI audit report renewed every two years.
          zh: BSCI 审核报告每两年更新。
      - icon: wrench
        title:
          en: Ten-year spares promise
          zh: 十年备件承诺
        body:
          en: Every fastener and board kept in stock for a decade.
          zh: 每一颗螺丝与控制板，十年常备库存。
