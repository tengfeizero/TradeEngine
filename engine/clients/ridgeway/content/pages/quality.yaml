title:
  en: Quality control & inspection
  zh: 品控与检验
summary:
  en: What we test, how often, and what happens when a batch fails. Sampling plans, torque records and the three defects we treat as stop-the-line.
  zh: 我们测什么、多久测一次、不合格怎么处理。抽检计划、扭矩记录，以及三类停线缺陷。
