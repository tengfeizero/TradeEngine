summary:
  en: "A longtail that survives depot life — 6066 frame, four-piston brakes, and a cargo deck drilled for standard Euro containers."
  zh: 能扛住车队日常的长尾车——6066 车架、四活塞刹车，载货平台已按标准欧标箱体开好安装孔。

description:
  en: |
    Cargo bikes are bought on payload and killed by flex. The C-40 uses a 6066 longtail with a reinforced cargo deck, a second triangulation behind the seat tube, and a 1.5 mm wall thickness at the chainstay yoke — the point where cheap longtails crack first.

    The deck is drilled to the 600 × 400 mm Euro container pattern and pre-wired for a rear light and a container lock, so your operator bolts on their box rather than fabricating a bracket.
  zh: |
    载货车买的是载重，死的是刚性。C-40 用 6066 长尾车架、加强载货平台、座管后方第二组三角补强，后下叉接头的壁厚做到 1.5 毫米——廉价长尾最先开裂的就是这里。

    平台按 600 × 400 毫米欧标箱体开孔，并预留尾灯与箱锁线束，运营方直接上箱，不必自行做支架。

highlights:
  - en: 250 kg rated payload, tested at 1.5× static load
    zh: 额定载重 250 公斤，按 1.5 倍静载测试
  - en: 1.5 mm chainstay yoke, the joint that fails first on cheap frames
    zh: 后下叉接头壁厚 1.5 毫米，廉价车架最先断裂处
  - en: Deck pre-drilled to the Euro container pattern
    zh: 平台按欧标箱体预开孔
  - en: Dual battery option, 1,008 Wh for a full delivery shift
