title:
  en: E-500 E-MTB
  zh: E-500 电助力山地
subtitle:
  en: 85 Nm mid-drive, 720 Wh, 140 mm travel, EN 15194 certified
  zh: 85 牛米中置电机，720 瓦时，140 毫米行程，通过 EN 15194

summary:
  en: "The e-MTB platform for brands that already sell analogue trail bikes — same geometry language, same handling, with 85 Nm where the climb starts."
  zh: 给已经在卖人力越野车的品牌：同一套几何语言、同一种操控，在爬坡处多出 85 牛米。

description:
  en: |
    An e-MTB that handles like an e-bike loses the trail rider. We kept the M-720's 66° head angle and 435 mm chainstays, then put the motor mass low and central — the battery sits in the down tube rather than behind the seat tube, so the front wheel stays loaded on steep climbs.

    The frame passes EN 15194 as a complete EPAC, including the 25 km/h cut-off behaviour under load, which is where most OE frames fail the test the first time.
  zh: |
    骑起来像电器的电助力山地车，会失去越野骑手。我们保留 M-720 的 66 度头管角与 435 毫米后下叉，再把电机质量放到低且居中的位置——电池在下管而不是座管后方，陡坡时前轮仍然压得住。

    车架以整车型式通过 EN 15194，包含负载下的 25 公里限速表现——多数 OE 车架第一次送检就卡在这里。

highlights:
  - en: Same geometry as the M-720 — trail handling, not appliance handling
    zh: 与 M-720 同一套几何——越野操控，不是电器感
  - en: Down-tube battery keeps front wheel loaded on climbs
    zh: 下管电池让爬坡时前轮保持载荷
  - en: 85 Nm mid-drive, 720 Wh, 110 km eco range
    zh: 85 牛米中置，720 瓦时，节能模式续航 110 公里
  - en: Passes EN 15194 as a complete EPAC under load
    zh: 以整车型式通过 EN 15194，含负载工况

