summary:
  en: The fold and the hinge are the whole product. Ours folds in three seconds with one hand and passes a 1,200 N clamp test on every batch.
  zh: 折叠车卖的就是折叠动作与铰链。我们单手三秒折好，每批铰链过 1200 牛夹紧测试。

description:
  en: |
    Folding bikes sell on two numbers: folded volume and weight. The F-20 folds to 80 × 38 × 62 cm in three seconds with one hand, and the complete bike is 12.6 kg — light enough to carry up four floors, which is the real adoption threshold in Japanese and Dutch walk-ups.

    The hinge is the part that fails, so it uses a double-locking cam with a 1,200 N clamp test per batch, and the frame is x-ray inspected at the weld seam every 500 units.
  zh: |
    折叠车只卖两个数字：折叠体积和重量。F-20 单手三秒折到 80 × 38 × 62 厘米，整车 12.6 公斤——轻到能搬上四层楼，这是日本与荷兰楼梯房的真实使用门槛。

    铰链是最容易失效的部件。我们用双锁定偏心扣，每批抽检 1200 牛夹紧力，每 500 台对焊缝做一次 X 光检测。

