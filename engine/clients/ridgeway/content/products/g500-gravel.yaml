summary:
  en: "Gravel is the fastest-moving category in the European range, and the G-500 is built to be re-specced cheaply — same frame, three build levels, one geometry."
  zh: 砾石是欧洲增长最快的品类。G-500 的设计目标就是「低成本换配置」：同一车架、三个配置等级、一套几何。

description:
  en: |
    Buyers ask for gravel, then argue about tyre clearance. We settled on 45 mm at the chainstay yoke and 50 mm at the fork — enough for a 700×45c knobby, still inside the ISO 4210 clearance requirement with mud.

    The frame carries rack and fender mounts, three bottle positions, and a bento-box boss on the top tube. Carbon fork is standard; an alloy fork version is available for price-point builds under €900 retail.
  zh: |
    买家都要砾石，然后为胎宽吵架。我们定在后下叉接头 45 毫米、前叉 50 毫米——够装 700×45c 齿胎，且在泥地条件下仍满足 ISO 4210 的间隙要求。

    车架带前后货架与挡泥板安装孔、三个水壶位、上管补给盒螺柱。碳纤维前叉为标配；零售价 900 欧元以下的价位段可选铝叉版本。

