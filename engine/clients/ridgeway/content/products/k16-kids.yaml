summary:
  en: Kids bikes are a compliance product before they are a design product. Every painted part on the K-16 carries an EN 71-3 and CPSIA test report tied to the production lot.
  zh: 童车首先是合规产品，其次才是设计产品。K-16 每个涂装件都有与生产批次绑定的 EN 71-3 与 CPSIA 检测报告。

description:
  en: |
    A kids bike that fails a phthalate test is a container stuck at customs. We buy paint and grips against EN 71-3 migration limits, hold the batch certificates, and print the lot number on the carton so a recall can be traced to a single container.

    Geometry is the other half: a low standover, a 42 cm Q-factor narrow enough for small hips, and a reach-adjustable stem so the same bike fits from age three to six.
  zh: |
    童车一旦领苯二甲酸酯超标，整柜就卡在海关。我们按 EN 71-3 迁移限值采购涂料与把套，留存批次证书，并在纸箱印批号，使召回可追溯到单一货柜。

    另一半是几何：低跨高、42 厘米窄 Q 值以适应儿童髋宽、可调前伸量的把立，让同一台车从三岁骑到六岁。

