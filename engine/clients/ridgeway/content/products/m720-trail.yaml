summary:
  en: The frame trail brands use when they want their own geometry but not their own factory. Modern 66° head angle, 435 mm chainstays, and a geometry sheet you can revise.
  zh: 越野品牌想要自有几何、又不想自建工厂时的选择。现代 66 度头管角、435 毫米后下叉，几何表可改。

description:
  en: |
    Trail geometry is a moving target — every season the numbers shift, and a frame that was progressive two years ago now feels nervous. We keep the M-720 jig adjustable, so a head angle or reach change is a drawing revision rather than a new tool.

    The frame is triple-butted 6061 with a 148 × 12 mm boost rear end, internal dropper routing, and a 2.4" tyre clearance at the chainstay yoke. Every production batch is pulled for ISO 4210-2 fatigue and impact testing at TÜV before it ships.
  zh: |
    越野几何一直在变——每季数字都在动，两年前还算进步的车架，现在骑着发飘。M-720 的夹具是可调的，改头管角或前伸量只是改图纸，不用重开模具。

    车架为三抽 6061，148 × 12 毫米 boost 后轴、内走线预留升降座管线位、后下叉接头可容 2.4 英寸胎宽。每批出厂前都在 TÜV 抽检 ISO 4210-2 疲劳与冲击。

highlights:
  - en: Adjustable jig — geometry changes are a drawing revision, not a new tool
    zh: 可调夹具——改几何是改图纸，不是重开模
