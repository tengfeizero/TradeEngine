summary:
  en: The volume model for European city ranges. Shimano Nexus 7 internal hub, hydraulic discs, full commuter kit — and a frame drawing you can put your own geometry into.
  zh: 欧洲城市车系的主力型号。Shimano Nexus 7 内变速、液压碟刹、全套通勤装备，车架图纸可改你的几何。

description:
  en: |
    City bikes fail in the details: a rack that cracks at 15 kg, fenders that rattle loose by the second season, cables that rub the head tube through the paint. The R-100 is specified against those failures — a 6061 frame with internal cable routing, a welded rack rated to 25 kg, and stainless hardware throughout.

    It is also the cheapest frame in our range to private-label. The down tube has a 240 × 60 mm flat zone for your decal, and we hold your paint code and artwork on file so repeat orders match without a new sample round.
  zh: |
    城市车往往败在细节：货架 15 公斤就裂、挡泥板第二个季度开始响、线管把车头管的漆磨穿。R-100 就是针对这些失败点定的规格——6061 车架内走线、焊接货架额定 25 公斤、全车不锈钢紧固件。

    它也是我们产品线里做自有品牌最省事的车架：下管有一段 240 × 60 毫米的平面贴花区，你的色号和贴花我们存档，返单不需再走一轮打样。

highlights:
  - en: Shimano Nexus 7 internal hub, maintenance-free for fleet use
    zh: Shimano Nexus 7 内变速，车队使用免维护
  - en: Welded rear rack rated to 25 kg, not bolted on
    zh: 焊接后货架额定 25 公斤，非螺栓外挂
  - en: Internal cable routing, no paint rub at the head tube
    zh: 内走线，车头管不磨漆
  - en: 240 × 60 mm flat decal zone on the down tube
    zh: 下管 240 × 60 毫米平面贴花区

