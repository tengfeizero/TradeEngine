summary:
  en: Our highest-volume EPAC platform. Mid-drive torque sensing, removable in-frame battery, and a frame that passes EN 15194 without a derating note.
  zh: 出货量最大的电助力平台。中置力矩传感、车架内可拆电池，整车型式通过 EN 15194，无需降额说明。

description:
  en: |
    Most e-city failures come from three places: the battery mount, the speed sensor, and the controller's behaviour in rain. The R-320 uses a locking in-frame battery with a secondary mechanical latch, a sealed cadence-plus-torque sensor, and an IP65 controller mounted away from the rear wheel spray zone.

    For rental fleets we can ship the same frame with a locked battery, a fleet keyway, and a telematics pocket under the top tube — so your operator can add tracking without drilling the frame.
  zh: |
    电助力城市车的问题八成出在三处：电池安装座、速度传感器、以及控制器在雨天的表现。R-320 用带二次机械锁扣的车架内电池、密封的踏频加力矩双传感、以及避开后轮溅水区的 IP65 控制器。

    面向租赁车队，同一车架可配锁死电池、车队统一钥匙，并在上管下方预留 telematics 安装仓——运营商加装定位不必在车架上打孔。

