# Zentea / 任意 engine 站点的 nginx 配置样例。
# 要点：静态文件直接服务；带内容哈希的文件永久缓存；询盘 API 转给 engine serve。
#
# 用法：替换 server_name、证书路径、root 后拷到 /etc/nginx/sites-available/，
# ln -s 到 sites-enabled/，nginx -t && systemctl reload nginx。

server {
    listen 80;
    server_name www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.example.com;

    ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;

    root /srv/www/mysite;
    index index.html;

    # 压缩（文本类产物收益最大）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带内容哈希的文件：内容变则名字变，可永久缓存
    location ~* \.[0-9a-f]{8}\.[A-Za-z0-9]+$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其余静态资源：短缓存 + 协商
    location ~* \.(png|jpe?g|webp|avif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # 询盘 API：转给 engine serve（127.0.0.1:8091，systemd 常驻）
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 1m;
    }

    # 静态站：try_files 兜底 404（引擎已产出 404.html）
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
