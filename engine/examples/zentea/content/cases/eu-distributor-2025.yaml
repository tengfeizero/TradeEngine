title:
  en: German private label switches to fixed cup profile
  zh: 德国自有品牌改用固定杯感供应
country: DE
industry:
  en: Private label retail
  zh: 自有品牌零售
customer: European distributor
challenge:
  en: Seasonal variation between lots forced the buyer to re-blend, and re-labelling cost them shelf space.
  zh: 批次间的季节差异迫使买家自行拼配，重新贴标又损失了货架位置。
solution:
  en: We reserved two garden plots for their profile, blended to a locked specification, and shipped in three pre-agreed lots.
  zh: 我们为其锁定两片茶园，按固定规格拼配，并分三批预先约定的货期发运。
result:
  en: Repeat orders up 38% in 12 months, zero re-labelling.
  zh: 12 个月内复购增长 38%，零返工贴标。
