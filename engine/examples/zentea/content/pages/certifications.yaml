  - type: faq
    title:
      en: Verification
      zh: 核验方式
    items:
      - q:
          en: How do I verify a certificate?
          zh: 如何核验证书？
        a:
          en: Take the registration number from the card and search it on the issuer's website (OneCert, CERES or SGS). If it does not appear, ask us for the scanned original.
          zh: 取卡片上的注册编号，在发证机构官网（OneCert、CERES 或 SGS）查询。查不到可直接向我们索取原件扫描件。
      - q:
          en: Can you send the full test report?
          zh: 能提供完整检测报告吗？
        a:
          en: Yes, per lot. Pesticide residue panels cover the EU MRL list and Japan's positive list.
          zh: 可以，按批次提供。农残检测覆盖欧盟 MRL 清单与日本肯定列表。
  - type: inquiry
