  zh: 资质认证与检测报告
summary:
  en: Current organic, food-safety and social-compliance certificates. Numbers are listed so buyers can verify them with the issuer.
  zh: 现行有效的有机、食品安全与社会责任认证。证书编号全部公开，买方可直接向发证机构核验。
updated_at: 2026-08-30
blocks:
  - type: richtext
    title:
      en: Why we publish the numbers
      zh: 为什么公开证书编号
    body:
      en: |
        A certificate logo proves nothing — anyone can paste one into a page. What a buyer can act on is the issuer, the registration number and the validity window, because those can be checked in a minute on the certifier's own site.

        Every certificate below is the current version. Expired certificates are removed from this page automatically at build time rather than left up as decoration.
      zh: |
        证书图标本身证明不了什么——谁都能贴一张图。买家真正能用的是发证机构、注册编号与有效期，因为这些一分钟内就能在发证机构官网核实。

        下面每一张都是现行版本。过期证书会在构建时自动从本页移除，而不是留着当装饰。
  - type: certificate_grid
    title:
