  - type: process
    title:
      en: From leaf to container
      zh: 从鲜叶到货柜
    intro:
      en: Seven steps, each with a documented check. The buyer's specification is attached to the lot card, not kept in someone's head.
      zh: 七个环节，每步都有记录检查。买家的规格跟批次卡走，而不是记在某个人脑子里。
    steps:
      - title: { en: Plot reservation, zh: 茶园锁定 }
        body:
          en: Plots are reserved by specification before the spring flush, so volume does not depend on the spot market.
          zh: 春茶前按规格锁定地块，产量不依赖现货市场。
      - title: { en: Hand picking, zh: 人工采摘 }
        body:
          en: Two leaves and a bud, picked in the morning and delivered to the plant the same day.
          zh: 一芽两叶，上午采摘当天送达工厂。
      - title: { en: Steaming, zh: 蒸青 }
        body:
          en: Within six hours of picking. Steam time is recorded per batch — it is the main lever on colour and umami.
          zh: 采摘后六小时内完成。每批记录蒸青时长——这是决定色泽与鲜味的主要变量。
      - title: { en: Rolling & drying, zh: 揉捻与干燥 }
        body:
          en: Shape is set on a two-stage roller; final moisture is held at or below 5%.
          zh: 两段式揉捻定型，最终水分控制在 5% 以内。
      - title: { en: Blending to spec, zh: 按规格拼配 }
        body:
          en: Lots are blended against the approved sample, cupped blind by two people.
          zh: 以确认样为基准拼配，两人盲评。
      - title: { en: Metal detection & packing, zh: 金检与包装 }
        body:
          en: Every bag passes a metal detector; packing is 25 kg kraft with a food-grade liner.
          zh: 每袋过金属探测，25 公斤牛皮纸袋内衬食品级膜。
      - title: { en: Container loading, zh: 装柜 }
        body:
          en: Palletised, photographed, and sealed with a number sent to the buyer before departure.
          zh: 托盘化、拍照，装柜后铅封号在发运前发给买家。
