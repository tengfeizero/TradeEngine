  - type: faq
    title:
      en: Buyer questions
      zh: 买家常问
    items:
      - q:
          en: Can we visit before ordering?
          zh: 下单前可以来访厂吗？
        a:
          en: Yes. We host buyer audits from March to October. Send dates at least two weeks ahead so we can arrange cupping and line time.
          zh: 可以。3 月至 10 月接待买家审厂，请提前两周告知日期，以便安排评茶与产线时间。
      - q:
          en: Do you private label?
          zh: 支持自有品牌吗？
        a:
          en: Yes — tins, pyramid bags and flat pouches, from 3,000 units per SKU.
          zh: 支持——罐装、三角袋与平口袋，单 SKU 3,000 件起。
      - q:
          en: What is the minimum order?
          zh: 起订量是多少？
        a:
          en: 500 kg per grade for bulk leaf. Sample orders of 5 kg are available at cost.
          zh: 散茶每个等级 500 公斤起；5 公斤样品单按成本价供应。
  - type: inquiry
