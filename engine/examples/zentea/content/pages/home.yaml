  - type: product_grid
    title:
      en: Tea we ship most
      zh: 出口量最大的茶
    intro:
      en: Two grades cover most private-label briefs. Both are blended to a fixed specification.
      zh: 两个等级即可覆盖多数自有品牌需求，均按固定规格拼配。
    featured: true
    limit: 6
  - type: image_text
    title:
      en: A cup profile you can put on a contract
      zh: 可以写进合同的杯感
    body:
      en: |
        Most tea buyers lose margin in re-blending: the March sample and the September shipment taste different, so the label has to change and the shelf position goes with it.

        We reserve garden plots for your specification, blend to a locked recipe, and ship in pre-agreed lots — so what your customer tastes in spring is what they taste at Christmas.
      zh: |
        多数茶叶买家把利润耗在反复拼配上：三月样品与九月到货口感不同，标签要改，货架位置也跟着丢。

        我们为你的规格锁定茶园，按固定配方拼配，并按预先约定的批次发运——客户春天喝到的味道，圣诞节还是同一个。
    bullets:
      - en: Locked recipe, no seasonal re-blend
        zh: 配方锁定，不随季节重拼
      - en: Pre-agreed shipping lots
        zh: 预先约定发运批次
      - en: Retained samples for every lot
        zh: 每批留样可追溯
    image: media/products/matcha-cover.png
    cta_text:
      en: See the factory
      zh: 看看工厂
    cta_href: "/factory/"
  - type: scenario_grid
    title:
      en: Who we supply
      zh: 我们供应谁
    intro:
      en: The same leaf, packed and specified differently for each channel.
      zh: 同一片叶子，按渠道做不同的规格与包装。
  - type: case_grid
    title:
      en: Recent work
      zh: 近期案例
    limit: 1
  - type: cta
    title:
      en: Send your specification, get a costed offer
      zh: 发来你的规格，收到带成本的报价
    body:
      en: Include volume, target market, certification requirements and destination port. We reply within 12 hours on business days.
      zh: 请注明采购量、目标市场、认证要求与目的港。工作日 12 小时内回复。
    cta_text:
      en: Request a quote
      zh: 获取报价
    cta_href: "/contact/"
  - type: inquiry
