summary:
  en: First-harvest tencha, shade-grown 21 days, stone-milled at 30g per hour. For premium retail and café chains.
  zh: 头采碾茶，遮光 21 天，石磨每小时仅磨 30 克。适合高端零售与连锁咖啡。

description:
  en: |
    Leaves are shaded for 21 days before picking to build L-theanine, then stone-milled slowly enough that the powder never heats above 40°C.

    The result is a matcha that stays bright green in a latte and keeps its sweetness without added sugar.
  zh: |
    采摘前遮光 21 天以积累茶氨酸，再用石磨以极慢速度研磨，粉温始终不超过 40°C。

    成品在拿铁中依然保持翠绿，不加糖也带自然甜感。

