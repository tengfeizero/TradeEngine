description:
  en: |
    Grown at 1,200 metres where morning mist keeps the leaves thin and tender, this sencha is steamed within six hours of picking to hold its bright, savoury edge.

    Each lot is blended to a fixed cup profile, so the batch you approve in March tastes the same in September — the single most important requirement for private label buyers.
  zh: |
    生长于海拔 1200 米，晨雾让叶片更薄更嫩。鲜叶在采摘后六小时内完成蒸青，锁住清亮的鲜味。

    每一批都按固定杯感拼配，三月确认的样品与九月到货的口感一致——这是自有品牌客户最看重的一点。

